<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6B45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="수학시러여">
<title>수학하기 시러여!</title>
<meta name="description" content="빨리 푸는 수학 말고, 고민하고 깊게 생각하는 수학. 초등 6년 수학을 노선도로 펼쳐, 우리 아이가 막힌 역을 찾아 함께 다시 걷는 부모용 길안내 앱.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 대체 글꼴(카페24 글꼴 파일이 없을 때만 보임) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@600&family=Gaegu:wght@700&family=Gowun+Dodum&display=swap">
<style>
/* 카페24 상업용 무료 글꼴: fonts.cafe24.com에서 받아 fonts/ 폴더에 넣으면 적용됨 */
@font-face{font-family:"Cafe24 Danjunghae";font-display:swap;
  src:url("fonts/Cafe24Danjunghae.woff2") format("woff2"),url("fonts/Cafe24Danjunghae.woff") format("woff"),url("fonts/Cafe24Danjunghae.ttf") format("truetype")}
@font-face{font-family:"Cafe24 Simplehae";font-display:swap;
  src:url("fonts/Cafe24Simplehae.woff2") format("woff2"),url("fonts/Cafe24Simplehae.woff") format("woff"),url("fonts/Cafe24Simplehae.ttf") format("truetype")}
@font-face{font-family:"Cafe24 Oneprettynight";font-display:swap;
  src:url("fonts/Cafe24Oneprettynight.woff2") format("woff2"),url("fonts/Cafe24Oneprettynight.woff") format("woff"),url("fonts/Cafe24Oneprettynight.ttf") format("truetype")}
/* 레이아웃: 연두 모눈 공책. 휴대폰은 한 열 + 하단 메뉴, 600px 이상은 왼쪽 레일 + 두 열(목록/지도 | 역 카드) */
:root{
  --paper:#F7FBF4; --grid:#DDEBD7; --card:#FDFEFB; --ink:#22382A; --muted:#5B7262;
  --green:#2E6B45; --soft:#E2F0DC; --edge:#2C4A36; --red:#C9392F; --hl:#FFEB85; --on-green:#FFFFFF;
  --l-number:#2E6B45; --l-relation:#C9392F; --l-shape:#3A6EA5; --l-data:#A8730E;
  --title:"Cafe24 Danjunghae","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;   /* 제목·숫자·버튼·질문: 단정해 */
  --body:"Cafe24 Simplehae","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;   /* 본문: 심플해(본문용) */
  --hand:"Cafe24 Oneprettynight","Gaegu","Apple SD Gothic Neo",cursive;   /* 짧은 손글씨 포인트: 고운밤 */
  --fs:16px;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141D17; --grid:#1F2C23; --card:#1A251E; --ink:#E2EDE4; --muted:#9DB3A3;
  --green:#8FCB9F; --soft:#22362A; --edge:#8FB39A; --red:#F08273; --hl:#5E5214; --on-green:#10261A;
  --l-number:#8FCB9F; --l-relation:#F08273; --l-shape:#86B4E8; --l-data:#E2B55A; color-scheme:dark}}
:root[data-size="lg"]{--fs:18.5px}
:root[data-theme="dark"]{
  --paper:#141D17; --grid:#1F2C23; --card:#1A251E; --ink:#E2EDE4; --muted:#9DB3A3;
  --green:#8FCB9F; --soft:#22362A; --edge:#8FB39A; --red:#F08273; --hl:#5E5214; --on-green:#10261A;
  --l-number:#8FCB9F; --l-relation:#F08273; --l-shape:#86B4E8; --l-data:#E2B55A; color-scheme:dark}

html,body{height:100%}
html{font-size:var(--fs)}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.7;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
h1,h2,h3{font-family:var(--title);font-weight:400;line-height:1.2;text-wrap:balance;margin:0}
.app{min-height:100%;display:flex;flex-direction:column}
.rail{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--edge);
  padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{font-family:var(--title);font-size:1.5rem;font-weight:400;color:var(--green);letter-spacing:-.5px}
.logo small{display:block;font-family:var(--body);font-size:0.6875rem;color:var(--muted);font-weight:400;letter-spacing:0}
.child-chip{margin-left:auto;border:2px solid var(--edge);border-radius:999px;padding:3px 12px;background:var(--card);font-size:0.875rem;white-space:nowrap}
.foot{padding:8px 16px calc(92px + env(safe-area-inset-bottom,0px));font-size:0.75rem;color:var(--muted);max-width:1180px;width:100%;margin:0 auto;box-sizing:border-box;border-top:1.5px dashed var(--grid)}
.foot p{margin:2px 0}
main{flex:1;padding:16px 16px 24px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start;max-width:1180px;width:100%;margin:0 auto;box-sizing:border-box}
.col{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start;min-width:0}
.panel-detail{display:none}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:2px solid var(--edge);
  display:grid;grid-template-columns:repeat(4,1fr);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.navbtn{background:none;border:0;padding:6px 0;display:grid;justify-items:center;gap:0;font-size:0.8125rem;color:var(--muted);border-radius:10px}
.navbtn b{font-family:var(--title);font-weight:400;font-size:1.1875rem;line-height:1}
.navbtn[aria-current="page"]{color:var(--green);background:var(--soft)}

.card{background:var(--card);border:2px solid var(--edge);border-radius:var(--r);padding:16px;box-shadow:3px 3px 0 var(--edge)}
.tape{position:relative}
.tape::before{content:"";position:absolute;top:-10px;left:24px;width:70px;height:18px;background:var(--hl);opacity:.85;transform:rotate(-3deg);border-radius:2px}
.eyebrow{font-size:0.8125rem;color:var(--muted);letter-spacing:.04em}
.hand{font-family:var(--hand)}
.big{font-size:1.6875rem}
.num{font-family:var(--title)}
.btn{border:2px solid var(--edge);border-radius:12px;background:var(--green);color:var(--on-green);padding:10px 16px;font-family:var(--title);font-weight:400;box-shadow:2px 2px 0 var(--edge)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.red{background:var(--card);color:var(--red);border-color:var(--red);box-shadow:2px 2px 0 var(--red)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mark{background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 2px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 10px;font-size:0.8125rem;border:1.5px solid currentColor;white-space:nowrap}
.pill.pass{color:var(--green)} .pill.stuck{color:var(--red)} .pill.gate{color:var(--ink);background:var(--hl);border-color:var(--edge)}
.muted{color:var(--muted)}
.small{font-size:0.875rem}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{border:2px solid var(--edge);border-radius:10px;background:var(--card);padding:4px 12px;font-family:var(--title);font-size:1rem;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--green);color:var(--on-green)}
.list{display:grid;gap:8px}
.st{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;border:2px solid var(--edge);border-radius:12px;background:var(--card);padding:8px 12px;width:100%}
.st[aria-selected="true"]{background:var(--soft)}
.st .no{font-family:var(--title);font-size:1.0625rem;font-weight:400;font-variant-numeric:tabular-nums;color:var(--muted);min-width:44px}
.st .nm{min-width:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.mapwrap{overflow-x:auto}
.mapwrap svg{display:block;min-width:560px;width:100%;height:auto}
.kv{display:grid;gap:12px}
.kv h3{font-size:1.375rem;color:var(--green)}
.kv p{margin:2px 0 0}
.levels{display:grid;gap:8px}
.lv{border:2px dashed var(--edge);border-radius:12px;padding:10px 12px;position:relative}
.lv .tag{font-family:var(--hand);font-size:1.3125rem;margin-right:6px}
.lock{color:var(--muted)}
.lock .tag::after{content:" 🔒";font-size:0.875rem}
.redpen{color:var(--red);font-family:var(--hand);font-size:1.3125rem}
.q{font-family:var(--title);font-size:1.3125rem;line-height:1.4}
.progress{height:10px;border:2px solid var(--edge);border-radius:999px;overflow:hidden;background:var(--card)}
.progress i{display:block;height:100%;background:var(--green)}
.example{font-size:0.75rem;border:1.5px dashed var(--muted);color:var(--muted);border-radius:6px;padding:0 6px;margin-left:6px;white-space:nowrap}
.field{display:grid;gap:4px}
.field input,.field select{font:inherit;border:2px solid var(--edge);border-radius:10px;padding:8px 10px;background:var(--card);color:var(--ink)}
.back{background:none;border:0;color:var(--green);font-weight:700;padding:0}
.wsbox{display:grid;gap:6px;margin-top:12px;justify-items:start}
a.btn{text-decoration:none;display:inline-block}
.notice{font-size:0.8125rem;color:var(--muted)}
table.rec{width:100%;border-collapse:collapse;font-size:0.9375rem}
table.rec td,table.rec th{padding:6px 4px;border-bottom:1.5px dashed var(--grid);text-align:left}
table.rec th{font-weight:400;color:var(--muted);font-size:0.8125rem}


/* ---------- 시작 화면 ---------- */
button.logo{background:none;border:0;padding:0;text-align:left;line-height:1.15}
.rail button.logo{text-align:center}
#intro{display:none}
body.intro-on #intro{display:block}
body.intro-on .app{display:none}
.intro{word-break:keep-all;max-width:880px;margin:0 auto;padding:28px 16px calc(40px + env(safe-area-inset-bottom,0px));display:grid;gap:20px}
.hero{text-align:center;display:grid;justify-items:center;gap:10px;padding:18px 0 4px}
.brandmark{display:inline-grid;justify-items:center;line-height:1;color:var(--green);font-family:var(--title)}
.brandmark .bm-top{font-size:1.5rem;letter-spacing:.32em;margin-right:-.32em;color:var(--ink)}
.brandmark .bm-main{font-size:clamp(3.4rem,15vw,5.6rem);letter-spacing:-.02em;position:relative;padding:0 .08em;
  background:linear-gradient(transparent 62%,var(--hl) 62%,var(--hl) 92%,transparent 92%)}
.brandmark .bm-bang{color:var(--red);display:inline-block;transform:rotate(12deg) translateY(-.04em);margin-left:.02em}
.bm-route{width:min(340px,86vw);height:auto;margin-top:6px}
.hero .sub{font-family:var(--title);font-size:1.25rem;margin:4px 0 0;text-wrap:balance}
.hero .lead{max-width:34em;margin:0;color:var(--muted);text-wrap:pretty}
.hero .row{justify-content:center;margin-top:8px}
.btn.lg{font-size:1.125rem;padding:12px 22px}
.steps{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.step{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;align-content:start}
.step .n{width:2.1rem;height:2.1rem;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center;font-family:var(--title);font-size:1.125rem}
.step h3{font-size:1.25rem;margin-bottom:2px}
.step p{margin:0;color:var(--muted)}
.story h2,.intro h2{font-size:1.5rem;margin-bottom:8px}
.story p{margin:0 0 10px;text-wrap:pretty}
.story .say{font-family:var(--hand);font-size:1.75rem;color:var(--red);margin:6px 0 12px;transform:rotate(-1.5deg);display:inline-block}
.story .sign{text-align:right;font-family:var(--hand);font-size:1.3rem;margin:0}
.who{margin:0;padding-left:1.2em}
.who li{margin:4px 0}
.intro .foot-note{font-size:.8125rem;color:var(--muted);text-align:center;margin:0}
@media (min-width:600px){
  .intro{padding-top:40px}
  .steps{grid-template-columns:repeat(3,minmax(0,1fr))}
  .step{grid-template-columns:1fr}
}

@media (min-width:600px){
  .app{flex-direction:row}
  .rail{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;box-sizing:border-box;width:96px;flex:none;
    border-right:2px solid var(--edge);background:var(--card);padding:16px 8px}
  .rail .logo{font-size:1.25rem;text-align:center;margin-bottom:12px}
  .rail .navbtn{padding:10px 0}
  .bottom{display:none}
  .shell{flex:1;min-width:0;display:flex;flex-direction:column}
  .top .logo{display:none}
  main{padding:20px 24px 32px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
  main.single{grid-template-columns:minmax(0,760px);justify-content:center}
  .panel-detail{display:grid;gap:16px;align-content:start;position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto;min-width:0}
  .phone-only{display:none}
  .foot{padding:12px 24px 24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div id="intro" aria-label="앱 소개"></div>
<div class="app">
  <nav class="rail" aria-label="메뉴">
    <button class="logo" data-act="intro-open" aria-label="앱 소개 보기">수학<br>시러여!</button>
    <button class="navbtn" data-nav="today"><b>오늘</b></button>
    <button class="navbtn" data-nav="diag"><b>진단</b></button>
    <button class="navbtn" data-nav="map"><b>지도</b></button>
    <button class="navbtn" data-nav="record"><b>기록</b></button>
  </nav>
  <div class="shell">
    <header class="top">
      <button class="logo" data-act="intro-open" aria-label="앱 소개 보기">수학하기 시러여!<small>빨리 푸는 수학 말고, 고민하고 깊게 생각하는 수학</small></button>
      <span class="child-chip" id="childChip"></span>
    </header>
    <main id="main"><div class="col"><p>불러오는 중…</p></div></main>
    <footer class="foot">
      <p><b>개인정보 처리방침</b> · 이용약관 · 환불 안내 <span class="example">셀프 테스트용 자리</span></p>
      <p>[상호] · 대표 [대표자] · 사업자등록번호 [ ] · 통신판매업 신고 [ ] · [연락 이메일]</p>
      <p>© 2026 수학하기 시러여! 모든 확인 질문과 생각 문제는 자체 제작했습니다. 글꼴: 카페24 단정해·심플해·고운밤</p>
    </footer>
  </div>
  <nav class="bottom" aria-label="메뉴">
    <button class="navbtn" data-nav="today"><b>오늘</b>홈</button>
    <button class="navbtn" data-nav="diag"><b>진단</b>관문</button>
    <button class="navbtn" data-nav="map"><b>지도</b>69개 역</button>
    <button class="navbtn" data-nav="record"><b>기록</b>성장</button>
  </nav>
</div>

<script>
(function(){
'use strict';
var DATA=null, byId={};
var KEY='suhak-proto-v1';
var LINE_VAR={number:'--l-number',relation:'--l-relation',shape:'--l-shape',data:'--l-data'};
var GATE_CH='①②③④⑤⑥⑦';

// ---------- 상태 (시제품: 이 기기 브라우저에만 저장) ----------
function sampleState(){
  return {sample:true, child:{nickname:'새싹',grade:3},
    progress:{'1-07':{s:'passed',at:'2026-09-14'},'2-01':{s:'passed',at:'2026-09-16'},'2-06':{s:'passed',at:'2026-09-21'},'3-03':{s:'stuck',at:'2026-09-28'}},
    diag:{1:'pass',2:'pass',3:'pass',4:'stuck'}, pass:false, view:'today', sel:'3-03', mapGrade:3, diagStep:null, detailOpen:false};
}
var S=load();
function load(){try{var v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&v.child)return v;}catch(e){}return sampleState();}
var KEY_UI='suhak-ui-v1';
function cloudOn(){return !!(S.cloud&&S.cloud.status==='on');}
function save(){try{
  if(cloudOn())localStorage.setItem(KEY_UI,JSON.stringify({size:S.size,selftest:S.selftest}));
  else{var c=S.cloud;delete S.cloud;localStorage.setItem(KEY,JSON.stringify(S));S.cloud=c;}
}catch(e){}}
function localState(){var keep={size:S.size,selftest:S.selftest};var v=load();v.size=keep.size;v.selftest=keep.selftest;return v;}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

// ---------- 이용권(시제품 미리보기) ----------
function sampleStationOf(g){var gs=DATA.stations.filter(function(s){return s.grade===g;});var gate=gs.find(function(s){return s.gate;});return (gate||gs[0]).id;}
function unlocked(st){return S.pass || st.id===sampleStationOf(st.grade);}

// ---------- 진단 ----------
function gatesFor(grade){return DATA.gates.filter(function(g){return byId[g.station].grade<=grade;});}
function diagResult(){
  var gs=gatesFor(S.child.grade);
  var stuck=gs.find(function(g){return S.diag[g.no]==='stuck';});
  if(stuck){var st=byId[stuck.station];return {gate:stuck,start:st,back:st.fromIds.map(function(i){return byId[i];}),ahead:st.next.map(function(i){return byId[i];})};}
  var answered=gs.every(function(g){return S.diag[g.no];});
  if(!answered)return null;
  var cand=DATA.stations.filter(function(s){return s.grade===S.child.grade && !(S.progress[s.id]&&S.progress[s.id].s==='passed');});
  var st=cand[0]||DATA.stations.filter(function(s){return s.grade===S.child.grade;}).slice(-1)[0];
  return {gate:null,start:st,back:[],ahead:st.next.map(function(i){return byId[i];})};
}

function syncDiag(){if(!DATA)return;DATA.gates.forEach(function(g){var p=S.progress[g.station];if(p)S.diag[g.no]=p.s==='passed'?'pass':'stuck';});}

// ---------- 노선도 SVG ----------
function routeSVG(hereId){
  var cs=getComputedStyle(document.documentElement);
  function c(v){return cs.getPropertyValue(v).trim();}
  var ink=c('--ink'),muted=c('--muted'),grid=c('--grid'),hl=c('--hl'),card=c('--card');
  var W=720,x0=118,colW=(W-x0-12)/6,rows={number:70,relation:126,shape:182,data:238};
  var out=['<svg viewBox="0 0 '+W+' 280" role="img" aria-label="4개 노선 6개 학년 노선도">'];
  for(var g=1;g<=6;g++){var cx=x0+colW*(g-0.5);
    out.push('<text x="'+cx+'" y="26" text-anchor="middle" font-family="Cafe24 Danjunghae, IBM Plex Sans KR, sans-serif" font-size="16" fill="'+(g===S.child.grade?c('--green'):ink)+'">'+g+'학년</text>');
    if(g>1)out.push('<line x1="'+(x0+colW*(g-1))+'" x2="'+(x0+colW*(g-1))+'" y1="38" y2="262" stroke="'+grid+'" stroke-width="1.5"/>');}
  DATA.lines.forEach(function(L){var y=rows[L.key],col=c(LINE_VAR[L.key]);
    out.push('<text x="8" y="'+(y+5)+'" font-size="14" fill="'+ink+'">'+L.name+'</text>');
    out.push('<line x1="'+x0+'" x2="'+(W-12)+'" y1="'+y+'" y2="'+y+'" stroke="'+col+'" stroke-width="4" stroke-linecap="round"/>');
    for(var g=1;g<=6;g++){
      var ss=DATA.stations.filter(function(s){return s.grade===g&&s.lineKey===L.key;});
      ss.forEach(function(s,i){var x=x0+colW*(g-1)+(i+0.5)*colW/ss.length;var p=S.progress[s.id];
        var r=s.gate?7:4.5, fill=p&&p.s==='passed'?col:card, stroke=col;
        if(p&&p.s==='stuck'){fill=c('--red');stroke=c('--red');}
        out.push('<circle cx="'+x.toFixed(1)+'" cy="'+y+'" r="'+r+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2.5"><title>'+s.id+' '+esc(s.name)+'</title></circle>');
        if(s.gate)out.push('<text x="'+x.toFixed(1)+'" y="'+(y-13)+'" text-anchor="middle" font-size="13" font-weight="700" fill="'+ink+'">'+GATE_CH[s.gate-1]+'</text>');
        if(s.id===hereId){out.push('<rect x="'+(x-34).toFixed(1)+'" y="'+(y+12)+'" width="68" height="22" rx="6" fill="'+hl+'" stroke="'+ink+'" stroke-width="1.5"/><text x="'+x.toFixed(1)+'" y="'+(y+28)+'" text-anchor="middle" font-family="Cafe24 Oneprettynight, Gaegu, cursive" font-size="17" fill="'+ink+'">지금 여기</text>');}
      });
    }
  });
  out.push('<text x="8" y="272" font-size="12" fill="'+muted+'">● 채운 점 = 통과 · 빨간 점 = 막힘 · 큰 점 = 관문역</text></svg>');
  return out.join('');
}

function stationCard(id){

  var line=DATA.lines.find(function(l){return l.key===s.lineKey;}).name;
  function lv(tag,txt,lock){return '<div class="lv'+(lock?' lock':'')+'"><span class="tag">'+tag+'</span>'+(lock?'<span class="small">가족 연 구독에서 열려요</span>':esc(txt))+'</div>';}
  return '<section class="card tape">'+
    '<button class="back phone-only" data-act="close">← 돌아가기</button>'+
    '<div class="row"><span class="eyebrow"><span class="dot" style="background:var('+LINE_VAR[s.lineKey]+')"></span>'+line+'</span>'+(s.gate?'<span class="pill gate">관문 '+GATE_CH[s.gate-1]+'</span>':'')+(p?'<span class="pill '+(p.s==='passed'?'pass':'stuck')+'">'+(p.s==='passed'?'통과 '+p.at:'막힘 '+p.at)+'</span>':'')+'</div>'+

    '<div><h3>확인 질문</h3><p class="q">“'+esc(s.check.q)+'”</p><p class="small"><span class="redpen">통과</span> '+esc(s.check.pass)+'</p>'+
      '<div class="row"><button class="btn" data-mark="passed" data-id="'+s.id+'">통과했어요</button><button class="btn red" data-mark="stuck" data-id="'+s.id+'">막혔어요</button></div></div>'+
    '<div><h3>생각 문제</h3><div class="levels">'+lv('입구',s.think.entry,false)+lv('가운데',s.think.middle,!open)+lv('도전',s.think.challenge,!open)+'</div>'+wsLink(s.id)+'</div>'+
    '<div><h3>오개념</h3>'+(open?'<p><span class="redpen">✗</span> '+esc(s.misc.wrong)+'<br><span class="redpen" style="color:var(--green)">→</span> '+esc(s.misc.fix)+'</p>':'<p class="lock small">가족 연 구독에서 열려요</p>')+'</div>'+
    '<div class="row small">'+(s.fromIds.length?'<span class="muted">출발역</span> '+s.fromIds.map(function(i){return '<button class="pill pass" data-open="'+i+'">'+i+'</button>';}).join(' '):'')+
      (s.next.length?' <span class="muted">다음 역</span> '+s.next.map(function(i){return '<button class="pill pass" data-open="'+i+'">'+i+'</button>';}).join(' '):'')+'</div>'+
    (!open?'<p class="notice">이 학년의 맛보기 역은 <button class="pill gate" data-open="'+sampleStationOf(s.grade)+'">'+sampleStationOf(s.grade)+'</button> 입니다.</p>':'')+
    '</div></section>';
}

try{introOpen=!localStorage.getItem(INTRO_KEY);}catch(e){introOpen=true;}
function closeIntro(){introOpen=false;try{localStorage.setItem(INTRO_KEY,'1');}catch(e){}}
function brandRoute(){

  h+='<text x="170" y="52" text-anchor="middle" font-family="Cafe24 Oneprettynight, Gaegu, cursive" font-size="20" fill="var(--red)">여기서 막혔구나!</text></svg>';

function viewIntro(){
  var cnt=DATA?DATA.stations.length:69, fresh=S.sample&&!cloudOn();
  var startBtn=fresh?'<button class="btn lg" data-act="intro-start">우리 아이로 시작하기</button>':'<button class="btn lg" data-act="intro-start">앱으로 돌아가기</button>';

    +'<p class="sub">빨리 푸는 수학 말고, 고민하고 깊게 생각하는 수학</p>'
    +'<p class="lead">초등 6년 수학을 지하철 노선도처럼 펼쳐 놓고, 우리 아이가 막힌 역을 찾아 함께 다시 걷는 <b>부모용 길안내 앱</b>이에요.</p>'
    +'<div class="row">'+startBtn+sampleBtn+'</div></section>';
  h+='<section class="card tape"><h2>이렇게 써요</h2><div class="steps">'
    +'<div class="step"><span class="n">1</span><div><h3>관문 진단</h3><p>질문 5개, 10분이면 돼요. 정답보다 아이가 <span class="mark">어떻게 설명하는지</span>를 들어요.</p></div></div>'
    +'<div class="step"><span class="n">2</span><div><h3>노선도</h3><p>초등 수학 '+cnt+'개 역을 네 노선으로 이었어요. 막힌 역과, 그 앞에서 돌아갈 역이 보여요.</p></div></div>'
    +'<div class="step"><span class="n">3</span><div><h3>역 카드</h3><p>확인 질문, 생각 문제(입구·가운데·도전), 흔한 오개념, 출력용 학습지까지 한 장에 담았어요.</p></div></div>'
    +'</div></section>';
  h+='<section class="card story"><h2>이 앱을 만든 이유</h2>'+STORY.map(function(p){return /^“.*”$/.test(p)?'<p class="say">'+esc(p)+'</p>':'<p>'+esc(p)+'</p>';}).join('')
    +'<p class="sign">'+esc(STORY_SIGN)+'</p></section>';
  h+='<section class="card"><h2>이런 부모님께</h2><ul class="who">'
    +'<li>홈스쿨·대안학교처럼 다른 길을 택했지만, 수학적 사고력은 놓치고 싶지 않은 부모님</li>'
    +'<li>빠른 문제 풀이에 지쳐 “수학 싫어”가 입에 붙은 아이를 둔 부모님</li>'
    +'<li>우리 아이가 어디서 막혔는지, 어디로 돌아가야 하는지 알고 싶은 부모님</li></ul></section>';
  h+='<div class="hero" style="padding-top:0"><div class="row">'+startBtn+sampleBtn+'</div></div>';
  h+='<p class="foot-note">부모님이 가입하고 쓰는 앱이에요. 아이 정보는 별명과 학년만 받아요. · 지금은 무료 베타예요.</p>';
  h+='<p class="foot-note">© 2026 수학하기 시러여! 모든 확인 질문과 생각 문제는 자체 제작했습니다.</p></div>';

function detailCol(){return '<aside class="panel-detail" aria-label="역 카드">'+(S.sel?stationCard(S.sel):'<div class="card"><p class="muted">역을 고르면 여기에 카드가 열려요.</p></div>')+'</aside>';}

function render(){
  document.documentElement.setAttribute('data-size',S.size==='lg'?'lg':'md');
  document.body.classList.toggle('intro-on',introOpen);
  var ib=document.getElementById('intro');
  if(introOpen){ib.innerHTML=viewIntro();save();return;}
  ib.innerHTML='';
  chip();
  document.querySelectorAll('[data-nav]').forEach(function(b){b.setAttribute('aria-current',b.dataset.nav===S.view?'page':'false');});
  var wide=window.matchMedia('(min-width:600px)').matches;
  var m=document.getElementById('main');
  if(!wide && S.detailOpen && S.sel){m.innerHTML='<div class="col">'+stationCard(S.sel)+'</div>';}
  else m.innerHTML=({today:viewToday,diag:viewDiag,map:viewMap,record:viewRecord}[S.view]||viewToday)();
  m.classList.toggle('single',S.view==='record');
  save();
}

document.addEventListener('click',function(e){
  var t=e.target.closest('button'); if(!t)return;
  if(t.dataset.nav){S.view=t.dataset.nav;S.detailOpen=false;if(S.view==='diag')S.diagStep=null;render();window.scrollTo(0,0);return;}
  if(t.dataset.open){S.sel=t.dataset.open;S.detailOpen=true;S.mapGrade=byId[S.sel].grade;render();if(!window.matchMedia('(min-width:600px)').matches)window.scrollTo(0,0);return;}
  if(t.dataset.grade){S.mapGrade=+t.dataset.grade;render();return;}
  if(t.dataset.size){S.size=t.dataset.size;render();return;}
  if(t.dataset.plat){S.platform=t.dataset.plat;S.storeSheet=false;render();return;}
  if(t.dataset.mark){S.progress[t.dataset.id]={s:t.dataset.mark,at:today()};syncDiag();if(cloudOn())cloudCall('saveProgress',t.dataset.id,t.dataset.mark);render();return;}
  if(t.dataset.child){cloudCall('selectChild',t.dataset.child);return;}
  if(t.dataset.diag){var gs=gatesFor(S.child.grade),g=gs[S.diagStep];
    if(t.dataset.diag==='prev'){S.diagStep=Math.max(0,S.diagStep-1);render();return;}
    S.diag[g.no]=t.dataset.diag; S.progress[g.station]={s:t.dataset.diag==='pass'?'passed':'stuck',at:today()}; if(cloudOn())cloudCall('saveProgress',g.station,S.progress[g.station].s);
    S.diagStep=t.dataset.diag==='stuck'?gs.length:S.diagStep+1; if(S.diagStep>=gs.length)S.sel=diagResult().start.id; render();return;}
  var a=t.dataset.act;
  if(a==='intro-open'){introOpen=true;render();window.scrollTo(0,0);return;}
  if(a==='intro-sample'){closeIntro();S.view='today';render();window.scrollTo(0,0);return;}
  if(a==='intro-start'){closeIntro();if(S.sample&&!cloudOn()){a='setup';window.scrollTo(0,0);}else{S.view='today';render();window.scrollTo(0,0);return;}}
  if(a==='diag-start'){S.diagStep=0;render();}
  else if(a==='diag-reset'){S.diag={};S.diagStep=0;render();}
  else if(a==='login-google'){cloudCall('loginGoogle');}
  else if(a==='reset-pw'){var em=document.getElementById('em');cloudCall('resetPassword',em?em.value.trim():'');}
  else if(a==='consent'){var ok=document.getElementById('over14');if(!ok||!ok.checked){S.cloud.msg='만 14세 이상 부모(보호자) 확인에 체크해 주세요.';render();}else cloudCall('consent');}
  else if(a==='logout'){cloudCall('logout');}
  else if(a==='add-child'){cloudCall('addChild');}
  else if(a==='delete-ask'){S.cloud.confirmDelete=true;render();}
  else if(a==='delete-no'){S.cloud.confirmDelete=false;render();}
  else if(a==='delete-yes'){cloudCall('deleteAccount');}
  else if(a==='close'){S.detailOpen=false;render();}
  else if(a==='pass'){S.pass=!S.pass;S.passSource=null;S.couponMsg='';render();}
  else if(a==='subscribe'){S.storeSheet=true;render();}
  else if(a==='cancelSheet'){S.storeSheet=false;render();}
  else if(a==='buy'){S.storeSheet=false;S.pass=true;S.passSource=S.platform==='ios'?'App Store':'Google Play';render();}
  else if(a==='restore'){render();}
  else if(a==='reset'){var keep=S.selftest,cl=S.cloud;S=sampleState();S.selftest=keep||{};S.cloud=cl;render();}
  else if(a==='setup'){S={sample:false,child:{nickname:'우리 아이',grade:S.child.grade},progress:{},diag:{},pass:false,view:'record',sel:null,mapGrade:S.child.grade,diagStep:null,detailOpen:false,selftest:S.selftest||{},size:S.size,cloud:S.cloud};render();var n=document.getElementById('nick');if(n){n.focus();n.select();}}
});
document.addEventListener('change',function(e){
  var k=e.target.dataset&&e.target.dataset.st; if(!k)return;
  S.selftest=S.selftest||{}; S.selftest[k]=e.target.checked; render();
  var el=document.getElementById('st-'+k); if(el)el.focus();
});
document.addEventListener('submit',function(e){
  if(e.target.id==='coupon'){e.preventDefault();
    var code=document.getElementById('couponCode').value.trim().toUpperCase().replace(/\s/g,'');
    if(code==='DONGARI-2027'||code==='DONGARI2027'){S.pass=true;S.passSource='coupon';S.couponMsg='동아리 쿠폰이 적용됐어요. 1년 동안 모든 역이 열립니다.';}
    else S.couponMsg=code?'이 코드는 쓸 수 없어요. 철자를 확인하거나, 이미 쓴 코드인지 확인해 주세요.':'쿠폰 코드를 넣어 주세요.';
    render();return;}
  if(e.target.id==='emailForm'){e.preventDefault();
    var mode=(e.submitter&&e.submitter.dataset.mode)||'in';
    cloudCall(mode==='up'?'signUpEmail':'loginEmail',document.getElementById('em').value.trim(),document.getElementById('pw').value);return;}
  if(e.target.id!=='profile')return; e.preventDefault();
  var n=document.getElementById('nick').value.trim().slice(0,12)||'우리 아이';
  var g=+document.getElementById('grade').value;
  if(g!==S.child.grade){S.diag={};S.diagStep=null;}
  S.child={nickname:n,grade:g};S.sample=false;S.mapGrade=g;S.view='today';if(cloudOn())cloudCall('saveChild',n,g);render();
});
window.matchMedia('(min-width:600px)').addEventListener('change',render);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);

window.SUHAK={
  get:function(){return S;},
  set:function(fn){fn(S);syncDiag();if(DATA)render();},
  local:function(){var c=S.cloud;S=localState();S.cloud=c;},
  today:today
};
S.cloud={status:'loading'};
setTimeout(function(){if(!window.Cloud&&S.cloud.status==='loading'){S.cloud={status:'unavailable'};if(DATA)render();}},6000);

fetch('stations.json').then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(function(d){
  DATA=d; d.stations.forEach(function(s){byId[s.id]=s;}); if(S.sel&&!byId[S.sel])S.sel=null; render();
}).catch(function(){document.getElementById('main').innerHTML='<div class="col"><div class="card">역 데이터(stations.json)를 불러오지 못했어요. 같은 폴더에 파일이 있는지 확인해 주세요.</div></div>';});
})();
</script>

  'permission-denied':'저장 권한이 없어요. 보안 규칙이 게시됐는지 확인해 주세요.'
};
function fail(e){ console.error(e); H.set(S => { S.cloud = Object.assign({}, S.cloud, { msg: MSG[e && e.code] || '문제가 생겼어요. 잠시 뒤 다시 해 주세요. (' + ((e && e.code) || '알 수 없음') + ')' }); }); }
function ymd(ts){ const d = ts && ts.toDate ? ts.toDate() : new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const kidsRef = uid => collection(db, 'users', uid, 'children');
const progRef = (uid, cid) => collection(db, 'users', uid, 'children', cid, 'progress');

async function loadChild(uid, child, children, email){
  const snap = await getDocs(progRef(uid, child.id));
  const progress = {};
  snap.forEach(d => { const v = d.data(); if (v.status === 'passed' || v.status === 'stuck') progress[d.id] = { s: v.status, at: ymd(v.updatedAt) }; });
  try { localStorage.setItem('suhak-child-' + uid, child.id); } catch (e) {}
  H.set(S => {
    S.cloud = { status: 'on', uid, email, children, childId: child.id };
    S.sample = false; S.child = { nickname: child.nickname, grade: child.grade };
    S.progress = progress; S.diag = {}; S.diagStep = null; S.mapGrade = child.grade;
    if (S.sel && !S.progress[S.sel]) S.sel = null;
  });
}

async function openAccount(user){
  const uid = user.uid, email = user.email || '';
  const u = await getDoc(doc(db, 'users', uid));
  if (!u.exists()) { H.set(S => { S.cloud = { status: 'consent', uid, email }; S.view = 'record'; }); return; }
  const ks = await getDocs(kidsRef(uid));
  let children = [];
  ks.forEach(d => { const v = d.data(); children.push({ id: d.id, nickname: v.nickname, grade: v.grade, t: v.createdAt ? v.createdAt.toMillis() : 0 }); });
  children.sort((a, b) => a.t - b.t);
  if (!children.length) {
    // 처음 로그인: 이 기기에서 쓰던 아이와 기록을 계정으로 옮김(예시 데이터는 옮기지 않음)
    const L = H.get();
    const nick = L.sample ? '우리 아이' : L.child.nickname, grade = L.sample ? L.child.grade : L.child.grade;
    const ref = await addDoc(kidsRef(uid), { nickname: nick, grade: grade, createdAt: serverTimestamp() });
    if (!L.sample && L.progress) {
      const b = writeBatch(db); let n = 0;
      Object.keys(L.progress).forEach(id => { const p = L.progress[id]; if (p.s === 'passed' || p.s === 'stuck') { b.set(doc(db, 'users', uid, 'children', ref.id, 'progress', id), { status: p.s, updatedAt: serverTimestamp() }); n++; } });
      if (n) await b.commit();
    }
    children = [{ id: ref.id, nickname: nick, grade }];
  }
  let pick = null; try { pick = localStorage.getItem('suhak-child-' + uid); } catch (e) {}
  const child = children.find(k => k.id === pick) || children[0];
  await loadChild(uid, child, children, email);
}

onAuthStateChanged(auth, user => {
  if (!user) { H.local(); H.set(S => { S.cloud = { status: 'off' }; }); return; }
  openAccount(user).catch(fail);
});

window.Cloud = {
  async loginGoogle(){
    const p = new GoogleAuthProvider();
    try { await signInWithPopup(auth, p); }
    catch (e) { if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') { await signInWithRedirect(auth, p); } else fail(e); }
  },
  async loginEmail(em, pw){ try { await signInWithEmailAndPassword(auth, em, pw); } catch (e) { fail(e); } },
  async signUpEmail(em, pw){ try { await createUserWithEmailAndPassword(auth, em, pw); } catch (e) { fail(e); } },
  async resetPassword(em){
    try { await sendPasswordResetEmail(auth, em); H.set(S => { S.cloud = Object.assign({}, S.cloud, { msg: em + ' 로 비밀번호 재설정 메일을 보냈어요.' }); }); }
    catch (e) { fail(e); }
  },
  async consent(){
    const user = auth.currentUser; if (!user) return;
    try {
      await setDoc(doc(db, 'users', user.uid), { displayName: user.displayName || '', over14: true, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
      await openAccount(user);
    } catch (e) { fail(e); }
  },
  async logout(){ try { await signOut(auth); } catch (e) { fail(e); } },
  async saveProgress(id, status){
    const c = H.get().cloud; if (!c || c.status !== 'on') return;
    try { await setDoc(doc(db, 'users', c.uid, 'children', c.childId, 'progress', id), { status, updatedAt: serverTimestamp() }); }
    catch (e) { fail(e); }
  },
  async saveChild(nickname, grade){
    const c = H.get().cloud; if (!c || c.status !== 'on') return;
    try {
      await setDoc(doc(db, 'users', c.uid, 'children', c.childId), { nickname, grade: Number(grade) }, { merge: true });
      H.set(S => { S.cloud.children = S.cloud.children.map(k => k.id === c.childId ? Object.assign({}, k, { nickname, grade: Number(grade) }) : k); });
    } catch (e) { fail(e); }
  },
  async addChild(){
    const c = H.get().cloud; if (!c || c.status !== 'on' || c.children.length >= 4) return;
    try {
      const ref = await addDoc(kidsRef(c.uid), { nickname: '아이 ' + (c.children.length + 1), grade: 1, createdAt: serverTimestamp() });
      const children = c.children.concat([{ id: ref.id, nickname: '아이 ' + (c.children.length + 1), grade: 1 }]);
      await loadChild(c.uid, children[children.length - 1], children, c.email);
      H.set(S => { S.view = 'record'; });
      setTimeout(() => { const n = document.getElementById('nick'); if (n) { n.focus(); n.select(); } }, 50);
    } catch (e) { fail(e); }
  },
  async selectChild(id){
    const c = H.get().cloud; if (!c || c.status !== 'on') return;
    const child = c.children.find(k => k.id === id); if (!child) return;
    try { await loadChild(c.uid, child, c.children, c.email); } catch (e) { fail(e); }
  },
  async deleteAccount(){
    const user = auth.currentUser; const c = H.get().cloud; if (!user || !c) return;
    const recent = Date.now() - new Date(user.metadata.lastSignInTime).getTime() < 5 * 60 * 1000;
    if (!recent) { H.set(S => { S.cloud.confirmDelete = false; S.cloud.msg = '보안을 위해 로그아웃 후 다시 로그인하고 5분 안에 삭제해 주세요.'; }); return; }
    try {
      for (const k of c.children) {
        const ps = await getDocs(progRef(c.uid, k.id));
        for (const d of ps.docs) await deleteDoc(d.ref);
        await deleteDoc(doc(db, 'users', c.uid, 'children', k.id));
      }
      await deleteDoc(doc(db, 'users', c.uid));
      await deleteUser(user);
      try { localStorage.removeItem('suhak-child-' + c.uid); } catch (e) {}
    } catch (e) { fail(e); }
  }
};
</script>
