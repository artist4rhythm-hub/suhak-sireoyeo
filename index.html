<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFBEA">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="수학시러여">
<title>수학하기 시러여!</title>
<meta name="description" content="빨리 푸는 수학 말고, 고민하고 깊게 생각하는 수학. 초등 6년 수학을 노선도로 펼쳐, 우리 아이가 막힌 역을 찾아 함께 다시 걷는 부모용 길안내 앱.">
<link rel="icon" href="icons/favicon-48.png" type="image/png" sizes="48x48">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 대체 글꼴(카페24 글꼴 파일이 없을 때만 보임) -->
<link rel="stylesheet" href="fonts/renew.css">
<style>
/* 카페24 상업용 무료 글꼴: fonts.cafe24.com에서 받아 fonts/ 폴더에 넣으면 적용됨 */
@font-face{font-family:"Cafe24 Danjunghae";font-display:swap;
  src:url("fonts/Cafe24Danjunghae.woff2") format("woff2"),url("fonts/Cafe24Danjunghae.woff") format("woff"),url("fonts/Cafe24Danjunghae.ttf") format("truetype")}
@font-face{font-family:"Cafe24 Simplehae";font-display:swap;
  src:url("fonts/Cafe24Simplehae.woff2") format("woff2"),url("fonts/Cafe24Simplehae.woff") format("woff"),url("fonts/Cafe24Simplehae.ttf") format("truetype")}
@font-face{font-family:"Cafe24 Oneprettynight";font-display:swap;
  src:url("fonts/Cafe24Oneprettynight.woff2") format("woff2"),url("fonts/Cafe24Oneprettynight.woff") format("woff"),url("fonts/Cafe24Oneprettynight.ttf") format("truetype")}
/* 레이아웃: 연두 모눈 공책. 휴대폰은 한 열 + 하단 메뉴, 600px 이상은 왼쪽 레일 + 두 열(목록/지도 | 역 카드) */
:root{
  --paper:#F7FBF4; --grid:#DDEBD7; --card:#FDFEFB; --ink:#22382A; --muted:#5B7262;
  --green:#2E6B45; --soft:#E2F0DC; --edge:#2C4A36; --red:#C9392F; --hl:#FFEB85; --on-green:#FFFFFF;
  --l-number:#2E6B45; --l-relation:#C9392F; --l-shape:#3A6EA5; --l-data:#A8730E;
  --title:"Cafe24 Danjunghae","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;   /* 제목·숫자·버튼·질문: 단정해 */
  --body:"Cafe24 Simplehae","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;   /* 본문: 심플해(본문용) */
  --hand:"Cafe24 Oneprettynight","Gaegu","Apple SD Gothic Neo",cursive;   /* 짧은 손글씨 포인트: 고운밤 */
  --fs:16px;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141D17; --grid:#1F2C23; --card:#1A251E; --ink:#E2EDE4; --muted:#9DB3A3;
  --green:#8FCB9F; --soft:#22362A; --edge:#8FB39A; --red:#F08273; --hl:#5E5214; --on-green:#10261A;
  --l-number:#8FCB9F; --l-relation:#F08273; --l-shape:#86B4E8; --l-data:#E2B55A; color-scheme:dark}}
:root[data-size="lg"]{--fs:18.5px}
:root[data-theme="dark"]{
  --paper:#141D17; --grid:#1F2C23; --card:#1A251E; --ink:#E2EDE4; --muted:#9DB3A3;
  --green:#8FCB9F; --soft:#22362A; --edge:#8FB39A; --red:#F08273; --hl:#5E5214; --on-green:#10261A;
  --l-number:#8FCB9F; --l-relation:#F08273; --l-shape:#86B4E8; --l-data:#E2B55A; color-scheme:dark}

html,body{height:100%}
html{font-size:var(--fs)}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.7;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
h1,h2,h3{font-family:var(--title);font-weight:400;line-height:1.2;text-wrap:balance;margin:0}
.app{min-height:100%;display:flex;flex-direction:column}
.rail{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--edge);
  padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{font-family:var(--title);font-size:1.5rem;font-weight:400;color:var(--green);letter-spacing:-.5px}
.logo small{display:block;font-family:var(--body);font-size:0.6875rem;color:var(--muted);font-weight:400;letter-spacing:0}
.child-chip{margin-left:auto;border:2px solid var(--edge);border-radius:999px;padding:3px 12px;background:var(--card);font-size:0.875rem;white-space:nowrap}
.foot{padding:8px 16px calc(92px + env(safe-area-inset-bottom,0px));font-size:0.75rem;color:var(--muted);max-width:1180px;width:100%;margin:0 auto;box-sizing:border-box;border-top:1.5px dashed var(--grid)}
.foot p{margin:2px 0}
main{flex:1;padding:16px 16px 24px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start;max-width:1180px;width:100%;margin:0 auto;box-sizing:border-box}
.col{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start;min-width:0}
.panel-detail{display:none}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:2px solid var(--edge);
  display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.navbtn{background:none;border:0;padding:6px 0;display:grid;justify-items:center;gap:0;font-size:0.8125rem;color:var(--muted);border-radius:10px}
.navbtn b{font-family:var(--title);font-weight:400;font-size:1.1875rem;line-height:1}
.navbtn[aria-current="page"]{color:var(--green);background:var(--soft)}

.card{background:var(--card);border:2px solid var(--edge);border-radius:var(--r);padding:16px;box-shadow:3px 3px 0 var(--edge)}
.tape{position:relative}
.tape::before{content:"";position:absolute;top:-10px;left:24px;width:70px;height:18px;background:var(--hl);opacity:.85;transform:rotate(-3deg);border-radius:2px}
.eyebrow{font-size:0.8125rem;color:var(--muted);letter-spacing:.04em}
.hand{font-family:var(--hand)}
.big{font-size:1.6875rem}
.num{font-family:var(--title)}
.btn{border:2px solid var(--edge);border-radius:12px;background:var(--green);color:var(--on-green);padding:10px 16px;font-family:var(--title);font-weight:400;box-shadow:2px 2px 0 var(--edge)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.red{background:var(--card);color:var(--red);border-color:var(--red);box-shadow:2px 2px 0 var(--red)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mark{background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 2px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 10px;font-size:0.8125rem;border:1.5px solid currentColor;white-space:nowrap}
.pill.pass{color:var(--green)} .pill.stuck{color:var(--red)} .pill.gate{color:var(--ink);background:var(--hl);border-color:var(--edge)}
.muted{color:var(--muted)}
.small{font-size:0.875rem}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{border:2px solid var(--edge);border-radius:10px;background:var(--card);padding:4px 12px;font-family:var(--title);font-size:1rem;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--green);color:var(--on-green)}
.list{display:grid;gap:8px}
.st{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;border:2px solid var(--edge);border-radius:12px;background:var(--card);padding:8px 12px;width:100%}
.st[aria-selected="true"]{background:var(--soft)}
.st .no{font-family:var(--title);font-size:1.0625rem;font-weight:400;font-variant-numeric:tabular-nums;color:var(--muted);min-width:44px}
.st .nm{min-width:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.mapwrap{overflow-x:auto}
.mapwrap svg{display:block;min-width:560px;width:100%;height:auto}
.kv{display:grid;gap:12px}
.kv h3{font-size:1.375rem;color:var(--green)}
.kv p{margin:2px 0 0}
.levels{display:grid;gap:8px}
.lv{border:2px dashed var(--edge);border-radius:12px;padding:10px 12px;position:relative}
.lv .tag{font-family:var(--hand);font-size:1.3125rem;margin-right:6px}
.lock{color:var(--muted)}
.lock .tag::after{content:" 🔒";font-size:0.875rem}
.redpen{color:var(--red);font-family:var(--hand);font-size:1.3125rem}
.q{font-family:var(--title);font-size:1.3125rem;line-height:1.4}
.progress{height:10px;border:2px solid var(--edge);border-radius:999px;overflow:hidden;background:var(--card)}
.progress i{display:block;height:100%;background:var(--green)}
.example{font-size:0.75rem;border:1.5px dashed var(--muted);color:var(--muted);border-radius:6px;padding:0 6px;margin-left:6px;white-space:nowrap}
.field{display:grid;gap:4px}
.field input,.field select{font:inherit;border:2px solid var(--edge);border-radius:10px;padding:8px 10px;background:var(--card);color:var(--ink)}
.back{background:none;border:0;color:var(--green);font-weight:700;padding:0}
.wsbox{display:grid;gap:6px;margin-top:12px;justify-items:start}
.pr-area{display:grid;gap:10px}
.pr-area h3{margin:0}
.pr-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pr-row .lab{font-family:var(--title);min-width:7.5em}
a.pfile{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--edge);border-radius:10px;padding:5px 10px;text-decoration:none;color:var(--ink,inherit);background:var(--card);font-size:0.875rem;white-space:nowrap}
a.pfile:hover{background:var(--soft)}
a.pfile small{color:var(--muted)}
.pr-grid{display:grid;gap:16px}
.pill.sem{color:var(--ink);background:var(--soft);border-color:var(--edge);font-family:var(--body);font-size:0.75rem;vertical-align:middle}
.semhead{font-family:var(--title);color:var(--green);font-size:1rem;margin:8px 2px 0;border-bottom:1.5px dashed var(--edge);padding-bottom:2px}
.semtxt{color:var(--green);font-weight:400;font-family:var(--title)}
.gstrip{position:relative;height:clamp(76px,22vw,150px);background:var(--card) right center/cover no-repeat;border-radius:16px;display:flex;flex-direction:column;justify-content:center;padding:0 0 0 5%;box-sizing:border-box}
.gstrip b{font-family:var(--title);font-weight:400;font-size:clamp(1.25rem,4.4vw,2rem);color:#1F3B2A;line-height:1.1}
.gstrip span{font-size:clamp(0.75rem,2vw,0.9375rem);color:#3d5446}
@media (prefers-color-scheme: dark){.gstrip b,.gstrip span{color:#1F3B2A}}
.pr-st{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;border-top:1.5px dashed var(--edge);padding-top:8px}
.pr-st .t{font-family:var(--title)}
.pr-st .t .no{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--green);color:var(--on-green);margin-right:6px;font-size:0.875rem}
.pr-st .ids{font-size:0.8125rem;color:var(--muted)}
.pr-legend{font-size:0.875rem;line-height:1.6}
.tabs.wrap{flex-wrap:wrap;overflow:visible}
@media(max-width:599px){.pr-row .lab{min-width:0;flex-basis:100%}}
a.btn{text-decoration:none;display:inline-block}
.notice{font-size:0.8125rem;color:var(--muted)}
table.rec{width:100%;border-collapse:collapse;font-size:0.9375rem}
table.rec td,table.rec th{padding:6px 4px;border-bottom:1.5px dashed var(--grid);text-align:left}
table.rec th{font-weight:400;color:var(--muted);font-size:0.8125rem}


/* ---------- 알림·의견·통계 ---------- */
.notice-card{border-color:var(--green);box-shadow:3px 3px 0 var(--green)}
.notice-card b{font-family:var(--title);font-weight:400;color:var(--green);margin-right:4px}
.field textarea{font:inherit;border:2px solid var(--edge);border-radius:10px;padding:8px 10px;background:var(--card);color:var(--ink);min-height:96px;resize:vertical}
/* ---------- 시작 화면 ---------- */
button.logo{background:none;border:0;padding:0;text-align:left;line-height:1.15}
.rail button.logo{text-align:center}
#intro{display:none}
body.intro-on #intro{display:block}
body.intro-on .app{display:none}
.intro{word-break:keep-all;max-width:880px;margin:0 auto;padding:28px 16px calc(40px + env(safe-area-inset-bottom,0px));display:grid;gap:20px}
.hero{text-align:center;display:grid;justify-items:center;gap:10px;padding:18px 0 4px}
.hero-art{width:min(100%,720px);aspect-ratio:3/2;background:var(--card) url(img/banner.webp) center/cover no-repeat;border-radius:18px;border:1.5px solid var(--edge);display:grid;justify-items:center;align-content:start;padding-top:clamp(14px,5%,40px);box-sizing:border-box}
.hero-art .brandmark{margin:0}
.mascot{float:right;width:clamp(64px,17vw,104px);height:auto;margin:-4px -2px 4px 10px}
.mascot.sm{width:clamp(52px,13vw,80px)}
.brandmark{display:inline-grid;justify-items:center;line-height:1;color:var(--green);font-family:var(--title)}
.brandmark .bm-top{font-size:1.5rem;letter-spacing:.32em;margin-right:-.32em;color:var(--ink)}
.brandmark .bm-main{font-size:clamp(3.4rem,15vw,5.6rem);letter-spacing:-.02em;position:relative;padding:0 .08em;
  background:linear-gradient(transparent 62%,var(--hl) 62%,var(--hl) 92%,transparent 92%)}
.brandmark .bm-bang{color:var(--red);display:inline-block;transform:rotate(12deg) translateY(-.04em);margin-left:.02em}
.bm-route{width:min(340px,86vw);height:auto;margin-top:6px}
.hero .sub{font-family:var(--title);font-size:1.25rem;margin:4px 0 0;text-wrap:balance}
.hero .lead{max-width:34em;margin:0;color:var(--muted);text-wrap:pretty}
.hero .row{justify-content:center;margin-top:8px}
.btn.lg{font-size:1.125rem;padding:12px 22px}
.steps{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.step{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;align-content:start}
.step .n{width:2.1rem;height:2.1rem;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center;font-family:var(--title);font-size:1.125rem}
.step h3{font-size:1.25rem;margin-bottom:2px}
.step p{margin:0;color:var(--muted)}
.story h2,.intro h2{font-size:1.5rem;margin-bottom:8px}
.story p{margin:0 0 10px;text-wrap:pretty}
.story .say{font-family:var(--hand);font-size:1.75rem;color:var(--red);margin:6px 0 12px;transform:rotate(-1.5deg);display:inline-block}
.story .sign{text-align:right;font-family:var(--hand);font-size:1.3rem;margin:0}
.who{margin:0;padding-left:1.2em}
.who li{margin:4px 0}
.intro .foot-note{font-size:.8125rem;color:var(--muted);text-align:center;margin:0}
@media (min-width:600px){
  .intro{padding-top:40px}
  .steps{grid-template-columns:repeat(3,minmax(0,1fr))}
  .step{grid-template-columns:1fr}
}

/* ---------- 기기별 배치 ----------
   폰(~599): 아래 메뉴 + 한 줄
   태블릿 세로(600~899): 왼쪽 메뉴 + 한 줄(역 카드는 눌렀을 때 화면 전체로)
   태블릿 가로·노트북(900~1399): 왼쪽 메뉴 + 두 줄(목록 | 역 카드)
   큰 화면(1400~): 두 줄을 넓게, 글자 조금 크게
   낮은 가로 화면(높이 ~500): 위쪽 띠 고정 해제, 아래 메뉴 얇게 */
@media (min-width:600px){
  .app{flex-direction:row}
  .rail{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;height:100dvh;box-sizing:border-box;width:84px;flex:none;
    border-right:2px solid var(--edge);background:var(--card);padding:16px 8px;overflow-y:auto}
  .rail .logo{font-size:1.125rem;text-align:center;margin-bottom:12px}
  .rail .navbtn{padding:10px 0}
  .bottom{display:none}
  .shell{flex:1;min-width:0;display:flex;flex-direction:column}
  .top .logo{display:none}
  main{padding:20px 24px 32px}
  main.single{grid-template-columns:minmax(0,760px);justify-content:center}
  .foot{padding:12px 24px 24px}
}
@media (min-width:900px){
  .rail{width:96px}
  .rail .logo{font-size:1.25rem}
  main{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
  .panel-detail{display:grid;gap:16px;align-content:start;position:sticky;top:76px;max-height:calc(100vh - 96px);max-height:calc(100dvh - 96px);overflow:auto;min-width:0}
  .phone-only{display:none}
}
@media (min-width:1200px){
  main{grid-template-columns:minmax(0,1.3fr) minmax(360px,1fr);gap:24px}
  .rail{width:108px}
}
@media (min-width:1400px){
  html{font-size:calc(var(--fs) * 1.06)}
  main,.foot{max-width:1440px}
  main.single{grid-template-columns:minmax(0,880px)}
}
@media (max-height:500px) and (orientation:landscape){
  .top{position:static}
  .bottom{padding:2px 4px calc(2px + env(safe-area-inset-bottom,0px))}
  .bottom .navbtn{padding:2px 0;font-size:0.75rem}
  .foot{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .rail{padding:8px 6px;gap:2px}
  .rail .logo{margin-bottom:4px}
  .rail .navbtn{padding:4px 0}
  .panel-detail{top:12px;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px)}
  .hero-art{aspect-ratio:3/1.4}
}
/* 넓은 화면에서 출력 목록은 두 칸으로 */
@media (min-width:1000px){
  main.single.wide-print{grid-template-columns:minmax(0,1240px)}
  main.single .pr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
}
@media (min-width:1600px){
  main.single.wide-print{grid-template-columns:minmax(0,1560px)}
  main.single .pr-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
/* 표·그림이 좁은 화면에서 넘치지 않게 */
img,svg{max-width:100%}
table.rec{display:block;overflow-x:auto}
@media (min-width:600px){table.rec{display:table}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ================= 리뉴얼: 여백 노트 =================
   글꼴: 한글 고운돋움, 숫자·기호는 Inter(빗금 없는 0) — 0과 ㅇ이 한눈에 달라요.
   선은 가늘게, 그림자 없이, 여백은 넉넉하게. */
:root{
  --paper:#FBFBF7; --card:#FFFFFF; --ink:#1E2A22; --muted:#66746A; --line:#E3E8DF; --line2:#CDD6C8;
  --soft:#EEF3EA; --edge:#CDD6C8;
  --title:"Num","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Num","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#141A16;--card:#1A221C;--ink:#E4ECE6;--muted:#9AAEA0;--line:#2A362E;--line2:#3A4A3F;--soft:#21302A;--edge:#3A4A3F}}
:root[data-theme="dark"]{--paper:#141A16;--card:#1A221C;--ink:#E4ECE6;--muted:#9AAEA0;--line:#2A362E;--line2:#3A4A3F;--soft:#21302A;--edge:#3A4A3F}
body{background-image:none;letter-spacing:-0.005em;line-height:1.75;font-feature-settings:"tnum" 1}
.num{font-family:"Num",var(--title);font-weight:600}
.top{border-bottom:1px solid var(--line);padding:14px 20px}
.child-chip{border:1px solid var(--line2)}

  .rep h2{break-after:avoid}.rep svg{break-inside:avoid}

<script>
(function(){
'use strict';
var DATA=null, byId={};
var KEY='suhak-proto-v1';
var LINE_VAR={number:'--l-number',relation:'--l-relation',shape:'--l-shape',data:'--l-data'};
var GATE_CH='①②③④⑤⑥⑦';

// ---------- 상태 (시제품: 이 기기 브라우저에만 저장) ----------
function sampleState(){
  return {sample:true, child:{nickname:'새싹',grade:3},
    progress:{'1-07':{s:'passed',at:'2026-09-14'},'2-01':{s:'passed',at:'2026-09-16'},'2-06':{s:'passed',at:'2026-09-21'},'3-03':{s:'stuck',at:'2026-09-28'}},
    diag:{1:'pass',2:'pass',3:'pass',4:'stuck'}, pass:false, view:'today', sel:'3-03', mapGrade:3, diagStep:null, detailOpen:false};
}
var S=load();
function load(){try{var v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&v.child)return v;}catch(e){}return sampleState();}
var KEY_UI='suhak-ui-v1';
function cloudOn(){return !!(S.cloud&&S.cloud.status==='on');}
function save(){try{
  if(cloudOn())localStorage.setItem(KEY_UI,JSON.stringify({size:S.size,selftest:S.selftest}));
  else{var c=S.cloud;delete S.cloud;localStorage.setItem(KEY,JSON.stringify(S));S.cloud=c;}
}catch(e){}}
function localState(){var keep={size:S.size,selftest:S.selftest};var v=load();v.size=keep.size;v.selftest=keep.selftest;return v;}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

// ---------- 이용권 ----------
// 지금은 모든 자료를 열어 두고 내용을 채우는 단계. 판매를 시작할 때 ALL_OPEN을 false로 바꾸면 예전 맛보기·구독 구조가 돌아와요.
var ALL_OPEN=true;
function sampleStationOf(g){var gs=DATA.stations.filter(function(s){return s.grade===g;});var gate=gs.find(function(s){return s.gate;});return (gate||gs[0]).id;}
function unlocked(st){return ALL_OPEN || S.pass || st.id===sampleStationOf(st.grade);}

// ---------- 진단 ----------
function gatesFor(grade){return DATA.gates.filter(function(g){return byId[g.station].grade<=grade;});}
function diagResult(){
  var gs=gatesFor(S.child.grade);
  var stuck=gs.find(function(g){return S.diag[g.no]==='stuck';});
  if(stuck){var st=byId[stuck.station];return {gate:stuck,start:st,back:st.fromIds.map(function(i){return byId[i];}),ahead:st.next.map(function(i){return byId[i];})};}
  var answered=gs.every(function(g){return S.diag[g.no];});
  if(!answered)return null;
  var cand=DATA.stations.filter(function(s){return s.grade===S.child.grade && !(S.progress[s.id]&&S.progress[s.id].s==='passed');});
  var st=cand[0]||DATA.stations.filter(function(s){return s.grade===S.child.grade;}).slice(-1)[0];
  return {gate:null,start:st,back:[],ahead:st.next.map(function(i){return byId[i];})};
}

function syncDiag(){if(!DATA)return;DATA.gates.forEach(function(g){var p=S.progress[g.station];if(p)S.diag[g.no]=p.s==='passed'?'pass':'stuck';});}

// ---------- 노선도 SVG ----------
function routeSVG(hereId){
  var cs=getComputedStyle(document.documentElement);
  function c(v){return cs.getPropertyValue(v).trim();}
  var ink=c('--ink'),muted=c('--muted'),grid=c('--grid'),hl=c('--hl'),card=c('--card');
  var W=720,x0=118,colW=(W-x0-12)/6,rows={number:70,relation:126,shape:182,data:238};
  var out=['<svg viewBox="0 0 '+W+' 280" role="img" aria-label="4개 노선 6개 학년 노선도">'];
  for(var g=1;g<=6;g++){var cx=x0+colW*(g-0.5);
    out.push('<text x="'+cx+'" y="26" text-anchor="middle" font-family="Cafe24 Danjunghae, IBM Plex Sans KR, sans-serif" font-size="16" fill="'+(g===S.child.grade?c('--green'):ink)+'">'+g+'학년</text>');
    if(g>1)out.push('<line x1="'+(x0+colW*(g-1))+'" x2="'+(x0+colW*(g-1))+'" y1="38" y2="262" stroke="'+grid+'" stroke-width="1.5"/>');}
  DATA.lines.forEach(function(L){var y=rows[L.key],col=c(LINE_VAR[L.key]);
    out.push('<text x="8" y="'+(y+5)+'" font-size="14" fill="'+ink+'">'+L.name+'</text>');
    out.push('<line x1="'+x0+'" x2="'+(W-12)+'" y1="'+y+'" y2="'+y+'" stroke="'+col+'" stroke-width="4" stroke-linecap="round"/>');
    for(var g=1;g<=6;g++){
      var ss=DATA.stations.filter(function(s){return s.grade===g&&s.lineKey===L.key;});
      ss.forEach(function(s,i){var x=x0+colW*(g-1)+(i+0.5)*colW/ss.length;var p=S.progress[s.id];
        var r=s.gate?7:4.5, fill=p&&p.s==='passed'?col:card, stroke=col;
        if(p&&p.s==='stuck'){fill=c('--red');stroke=c('--red');}
        out.push('<circle cx="'+x.toFixed(1)+'" cy="'+y+'" r="'+r+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2.5"><title>'+s.id+' '+esc(s.name)+'</title></circle>');
        if(s.gate)out.push('<text x="'+x.toFixed(1)+'" y="'+(y-13)+'" text-anchor="middle" font-size="13" font-weight="700" fill="'+ink+'">'+GATE_CH[s.gate-1]+'</text>');
        if(s.id===hereId){out.push('<rect x="'+(x-34).toFixed(1)+'" y="'+(y+12)+'" width="68" height="22" rx="6" fill="'+hl+'" stroke="'+ink+'" stroke-width="1.5"/><text x="'+x.toFixed(1)+'" y="'+(y+28)+'" text-anchor="middle" font-family="Cafe24 Oneprettynight, Gaegu, cursive" font-size="17" fill="'+ink+'">지금 여기</text>');}
      });
    }
  });
  out.push('<text x="8" y="272" font-size="12" fill="'+muted+'">● 채운 점 = 통과 · 빨간 점 = 막힘 · 큰 점 = 관문역</text></svg>');
  return out.join('');
}

// ---------- 화면 ----------
function chip(){document.getElementById('childChip').innerHTML=(cloudOn()?'<span title="로그인됨">☁ </span>':'')+esc(S.child.nickname)+' · <b>'+S.child.grade+'학년 '+(S.semS&&S.semG===S.child.grade?S.semS:semNow())+'학기</b>'+(S.sample?'<span class="example">예시</span>':'');}

function noticeCard(){var n=site('notice');return n&&n.trim()?'<div class="card small notice-card" role="note"><b>알림</b> '+rich(n.trim())+'</div>':'';}
// 새싹 차장(마스코트) 그림: hello · wave · think · yay
function MASCOT(k,cls){return '<img class="mascot'+(cls?' '+cls:'')+'" src="img/mascot-'+k+'.webp" alt="" width="104" height="138" loading="lazy">';}
function viewToday(){
  var g=S.child.grade, sm=(S.semG===g&&S.semS)?S.semS:semNow(), k=g+'-'+sm, d=semData(g,sm), r=semFix(semRes()[k]);
  var hasRun=['A','C','B'].some(function(v){return r.runs[v].done;});
  var J=(d&&hasRun)?semJudge(d,r):[], need=J.filter(function(j){return j.st==='sure'||j.st==='gap'||j.st==='shaky';}).sort(function(a,b){return ({sure:0,gap:1,shaky:2}[a.st])-({sure:0,gap:1,shaky:2}[b.st]);});
  var LB={sure:'확실히 빈 곳',shaky:'흔들림',gap:'채울 곳'};
  var hour=new Date().getHours(), hi=hour<11?'좋은 아침이에요':hour<17?'반가워요':'오늘도 수고했어요';
  var h='<div class="home">'+noticeCard();
  if(S.sample)h+='<div class="sample-bar"><span><b>예시 데이터</b>로 보고 있어요.</span><button class="btn ghost" data-act="setup">우리 아이로 시작하기</button></div>';
  h+='<section class="hello">'+MASCOT('wave','hello-m')+'<div><p class="hi">'+hi+', '+esc(S.child.nickname)+'!</p><h1>'+(need.length?'오늘은 정류장 하나만 채워요':(hasRun?'이번 학기 노선을 다 지났어요!':'이번 학기 노선부터 점검해 봐요'))+'</h1></div></section>';
  h+='<div class="home-grid"><div class="home-main">';
  // 오늘 탈 기차
  if(need.length){var x=need[0].x,ga=semCat(x.mod,x.st,'ga');
    h+='<section class="today-card"><p class="lab">오늘 탈 기차</p><h2>'+esc(x.unit)+' · 정류장 '+x.st+'</h2><p class="sub">'+esc(x.title)+' · <b>'+g+'학년 '+sm+'학기</b>'+(x.pre.length?' · 함께 다질 곳 ↩ '+esc(x.pre[0].label):'')+'</p>'+
      '<div class="row">'+(ga?'<a class="btn" data-pr="ga" href="'+esc(ga.file)+'" target="_blank" rel="noopener">(가) 기본편 출력 · '+ga.pages+'쪽</a>':'')+(conFile(g,sm,x.mod,x.st)?'<a class="btn ghost" data-pr="concept" href="'+conFile(g,sm,x.mod,x.st)+'" target="_blank" rel="noopener">개념 카드 보기</a>':'')+'<button class="btn ghost" data-nav="diag" data-dmode="sem">학기 점검 결과 보기</button></div></section>';
  } else if(!hasRun){
    h+='<section class="today-card"><p class="lab">처음이라면</p><h2>'+g+'학년 '+sm+'학기 노선 점검</h2><p class="sub">승차권(점검지) 한 장, 30분이면 이번 학기에 어디가 비었는지 알 수 있어요.</p>'+
      '<div class="row"><button class="btn" data-nav="diag" data-dmode="sem">학기 점검 시작</button><button class="btn ghost" data-nav="diag" data-dmode="gate">빠른 관문 진단 (10분)</button></div></section>';
  } else {
    h+='<section class="today-card"><p class="lab">잘했어요</p><h2>채울 정류장이 없어요</h2><p class="sub">B안으로 다시 확인하거나 (다) 생각편으로 더 깊이 다져 보세요.</p><div class="row"><button class="btn" data-nav="diag" data-dmode="sem">학기 점검 열기</button><button class="btn ghost" data-nav="print">출력 탭</button></div></section>';
  }
  // 이번 학기 노선
  if(d){var units=d.units;
    var okN=units.filter(function(u){return !r.skip[u.uid]&&!need.some(function(j){return j.x.uid===u.uid;});}).length;
    h+='<section class="sem-strip"><p class="lab">'+g+'학년 '+sm+'학기 노선'+(hasRun?' · '+units.length+'개 역 중 '+okN+'개 통과':' · 역 '+units.length+'개')+'</p><ol style="--n:'+units.length+'">'+units.map(function(u){
      var gp=need.some(function(j){return j.x.uid===u.uid;}), sk=r.skip[u.uid], st=!hasRun?'':(sk?'skip':(gp?'gap':'ok'));
      return '<li class="'+st+'"><span>'+(st==='ok'?'✓':st==='gap'?'!':(units.indexOf(u)+1))+'</span><p>'+esc(u.name)+'</p></li>';}).join('')+'</ol></section>';
  }
  h+='</div><aside class="home-side">';
  if(hasRun&&d){var act=d.items.filter(function(x){return !r.skip[x.uid];}), basis=r.runs.B.done?['B']:['A','C'].filter(function(v){return r.runs[v].done;});
    var sc=act.length?Math.round(basis.reduce(function(t,v){return t+act.filter(function(x){return !r.runs[v].wrong[x.n];}).length/act.length*100;},0)/basis.length):0;
    h+='<section class="side-sky"><p class="lab">최근 학기 점검 · '+basis.map(function(v){return v+'안';}).join('·')+'</p><div class="row" style="align-items:center;gap:14px"><b class="score">'+sc+'</b><span>점<br><small>채울 정류장 '+need.length+'곳</small></span></div><button class="btn sky" data-act="go-report">분석 보고서 보기</button></section>';
    if(need.length)h+='<section class="side-warm"><p class="lab">채울 정류장</p><ol>'+need.slice(0,5).map(function(j){return '<li>'+esc(j.x.unit)+' · 정류장 '+j.x.st+' <small>'+LB[j.st]+'</small></li>';}).join('')+'</ol></section>';
  } else {
    h+='<section class="side-sky"><p class="lab">학기 점검이란?</p><p>학교 진도에 맞춰 이번 학기 단원을 역처럼 돌아보고, <b>몇 학년 몇 학기</b>로 돌아가 채울지 알려 줘요.</p><button class="btn sky" data-nav="diag" data-dmode="sem">점검지 보기</button></section>';
  }
  var semSt=d?d.items.filter(function(x){return !r.skip[x.uid];}).length:0, good=J.filter(function(j){return j.st==='filled'||j.st==='ok';}).length;
  h+='<section class="side-plain"><p class="lab">'+g+'학년 '+sm+'학기 정류장</p><p class="num" style="margin:0;font-size:1.5rem">'+(hasRun?good+' / '+semSt:(semSt?semSt+'개':'—'))+'</p>'+(hasRun?'<div class="progress" aria-hidden="true"><i style="width:'+(semSt?good/semSt*100:0)+'%"></i></div><p class="small muted" style="margin:6px 0 0">튼튼한 정류장 / 이번 학기 점검 정류장</p>':'<p class="small muted" style="margin:6px 0 0">학기 점검을 하면 튼튼한 정류장과 채울 정류장이 나뉘어요.</p>')+'<button class="btn ghost" data-nav="map" style="margin-top:10px">노선 전체 보기</button></section>';
  h+='</aside></div></div>';
  return h+detailCol();
}


// ---------- 학기 점검(기차 노선) ----------
var SEM_KEY='suhak-sem-v1', SEMD={}, SEM_VER={A:'A안 · 처음',C:'C안 · 다른 모양',B:'B안 · 다 채운 뒤'};
function semRes(){try{return JSON.parse(localStorage.getItem(SEM_KEY)||'{}');}catch(e){return {};}}
function semSave(r){try{localStorage.setItem(SEM_KEY,JSON.stringify(r));}catch(e){}}
function semNow(){var m=new Date().getMonth()+1;return (m>=8||m<=1)?2:1;}
function semData(g,s){var k=g+'-'+s;if(SEMD[k]===undefined){SEMD[k]=null;fetch('worksheets/sem/g'+k+'.json').then(function(r){return r.ok?r.json():0;}).then(function(d){SEMD[k]=d||0;render();}).catch(function(){SEMD[k]=0;render();});}return SEMD[k];}
var COND={};function conData(g,s){var k=g+'-'+s;if(COND[k]===undefined){COND[k]=null;fetch('worksheets/concept/g'+k+'.json').then(function(r){return r.ok?r.json():0;}).then(function(d){COND[k]=d||0;render();}).catch(function(){COND[k]=0;});}return COND[k];}
function conFile(g,s,mod,st){var d=conData(g,s);if(!d)return null;var c=d.cards.filter(function(x){return x.mod===mod&&x.st===st;})[0];return c?c.file:null;}
function semCat(mod,st,kind){if(!CAT)return null;return CAT.items.filter(function(x){return x.mod===mod&&x.st===st&&x.kind===kind;})[0]||null;}
function semFix(r){r=r||{};r.skip=r.skip||{};r.runs=r.runs||{};if(r.wrong){r.runs.A={wrong:r.wrong,done:!!r.done,at:r.at};delete r.wrong;delete r.done;delete r.at;}
  ['A','B','C'].forEach(function(v){r.runs[v]=r.runs[v]||{wrong:{}};r.runs[v].why=r.runs[v].why||{};});r.fine=r.fine||{};r.ver=r.ver||'A';return r;}
function modeSeg(){var m=S.diagMode||'sem';return '<div class="seg dmode" role="group" aria-label="진단 종류">'+[['sem','학기 점검'],['gate','관문 진단 (빠른 10분)']].map(function(x){return '<button class="seg-b" aria-pressed="'+(x[0]===m)+'" data-dmode="'+x[0]+'">'+x[1]+'</button>';}).join('')+'</div>';}
var WHY={k:'몰랐어요',c:'계산 실수',r:'문제를 잘못 읽음',t:'시간이 모자람'}, WHYS={k:'몰',c:'계',r:'읽',t:'시'};
var FINE_V={back:{t:'돌아가기',d:'아래 학년 기초가 비어 있어요. 돌아갈 곳의 (가) 기본편을 먼저 풀어요.'},concept:{t:'개념부터',d:'개념 카드를 읽고 (가) 기본편부터 차례로 풀어요.'},apply:{t:'다지기부터',d:'기본은 돼요. (가)는 통과 확인만 풀고 (나) 다지기편 → (다) 생각편으로 가요.'},slip:{t:'실수였어요',d:'정밀 확인을 모두 맞혔어요. 이 정류장은 통과!'}};
function fineVerdict(x,f){
  if(!x.fine||!f||!f.done)return null;var ro=x.fine.roles,w=f.w||{},hit=function(set){for(var i=0;i<ro.length;i++)if(set.indexOf(ro[i])>=0&&w[i+1])return true;return false;};
  return hit('p')?'back':hit('b')?'concept':hit('at')?'apply':'slip';
}
function semWhy(r,n){var o=null;['B','C','A'].forEach(function(v){if(!o&&r.runs[v].done&&r.runs[v].wrong[n]&&r.runs[v].why[n])o=r.runs[v].why[n];});return o;}
function semJudge(d,r){
  var first=['A','C'].filter(function(v){return r.runs[v].done;}), B=r.runs.B.done;
  return d.items.map(function(x){
    if(r.skip[x.uid])return {x:x,st:'skip'};
    var wr=first.filter(function(v){return r.runs[v].wrong[x.n];}).length, st, why=semWhy(r,x.n);
    if(B){var wb=!!r.runs.B.wrong[x.n];st=wb?(wr?'sure':'shaky'):(wr?'filled':'ok');wr+=wb?1:0;}
    else{st=wr===0?'ok':(wr===first.length&&first.length>1?'sure':(first.length>1?'shaky':'gap'));
      if(st==='gap'&&why==='k')st='sure';else if(st==='gap'&&(why==='c'||why==='r'))st='shaky';}
    var fv=fineVerdict(x,r.fine[x.n]);
    if(fv&&st!=='ok'&&st!=='filled'){if(fv==='slip')return {x:x,st:'ok',wr:wr,why:why,fv:fv,slip:true};if(fv==='back'||fv==='concept')st=st==='shaky'?'gap':st;}
    return {x:x,st:st,wr:wr,why:why,fv:fv};});
}
function viewSem(){

function radarSVG(names,series,size){
  size=size||420;var n=names.length,cx=size/2,cy=size/2,R=size*0.32,ang=[];for(var i=0;i<n;i++)ang.push(-Math.PI/2+2*Math.PI*i/n);
  function P(i,r){return [cx+R*r*Math.cos(ang[i]),cy+R*r*Math.sin(ang[i])];}
  function poly(r){var a=[];for(var i=0;i<n;i++){var p=P(i,r);a.push(p[0].toFixed(1)+','+p[1].toFixed(1));}return a.join(' ');}
  var b='<polygon points="'+poly(0.6)+'" fill="#EDEDED" stroke="none"/>';
  for(var k=1;k<=10;k++){var w=k===6||k===9?1.6:(k===10?1.6:.6),dash=k===6||k===9?' stroke-dasharray="5 4"':'',col=k%10&&k!==6&&k!==9?'#C4C4C4':'#333';b+='<polygon points="'+poly(k/10)+'" fill="none" stroke="'+col+'" stroke-width="'+w+'"'+dash+'/>';}
  for(var i=0;i<n;i++){var p=P(i,1);b+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="#999" stroke-width=".8"/>';
    var q=P(i,1.2),c=Math.cos(ang[i]),anc=Math.abs(c)<.25?'middle':(c>0?'start':'end');
    b+='<text x="'+q[0].toFixed(1)+'" y="'+(q[1]+4).toFixed(1)+'" text-anchor="'+anc+'" font-size="13" fill="#111">'+esc(names[i])+'</text>';}
  var p6=P(0,.6),p9=P(0,.9);b+='<text x="'+(p6[0]+5)+'" y="'+(p6[1]+4)+'" font-size="10" fill="#555">60</text><text x="'+(p9[0]+5)+'" y="'+(p9[1]+4)+'" font-size="10" fill="#555">90</text>';
  series.forEach(function(se){var a=[];se.vals.forEach(function(v,i){var p=P(i,v/100);a.push(p[0].toFixed(1)+','+p[1].toFixed(1));});
    b+='<polygon points="'+a.join(' ')+'" fill="'+(se.fill||'none')+'" fill-opacity="'+(se.fill?.35:0)+'" stroke="#111" stroke-width="'+(se.w||2)+'"'+(se.dash?' stroke-dasharray="'+se.dash+'"':'')+'/>';
    se.vals.forEach(function(v,i){var p=P(i,v/100);b+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(se.r||3.5)+'" fill="#111"/>';});});
  return '<svg viewBox="-60 -10 '+(size+120)+' '+(size+20)+'" role="img" aria-label="단원별 실력 지도" style="width:100%;max-width:520px;height:auto;display:block;margin:0 auto">'+b+'</svg>';
}

    if(t.dataset.diag==='prev'){S.diagStep=Math.max(0,S.diagStep-1);render();return;}
    S.diag[g.no]=t.dataset.diag; S.progress[g.station]={s:t.dataset.diag==='pass'?'passed':'stuck',at:today()}; if(cloudOn())cloudCall('saveProgress',g.station,S.progress[g.station].s);
    S.diagStep=t.dataset.diag==='stuck'?gs.length:S.diagStep+1; if(S.diagStep>=gs.length){S.sel=diagResult().start.id;track('diag_done');} render();return;}
  var a=t.dataset.act;
  if(a==='intro-open'){introOpen=true;render();window.scrollTo(0,0);return;}
  if(a==='intro-sample'){track('intro_sample');closeIntro();S.view='today';render();window.scrollTo(0,0);return;}
  if(a==='intro-start'){if(S.sample&&!cloudOn())track('intro_start');closeIntro();if(S.sample&&!cloudOn()){a='setup';window.scrollTo(0,0);}else{S.view='today';render();window.scrollTo(0,0);return;}}
  if(a==='go-report'){S.view='diag';S.diagMode='sem';S.semReport=true;render();window.scrollTo(0,0);return;}
  if(a==='detail-close'){S.detailOpen=false;render();return;}
  if(a==='sem-done'){track('sem_done');S.semEdit=false;semSet(function(r){r.runs[r.ver].done=true;r.runs[r.ver].at=today();});window.scrollTo(0,0);return;}
  if(a==='sem-report'){track('sem_report');S.semReport=true;render();window.scrollTo(0,0);return;}
  if(a==='rep-close'){S.semReport=false;render();return;}
  if(a==='rep-print'){track('rep_print');window.print();return;}
  if(a==='sem-back'){S.semEdit=false;render();return;}
  if(a==='sem-clear'){semSet(function(r){r.runs[r.ver].wrong={};r.runs[r.ver].why={};});return;}
  if(a==='sem-reset'){S.semEdit=true;semSet(function(r){r.runs={};r.skip={};r.fine={};r.scope='all';r.ver='A';});return;}
  if(a==='diag-start'){track('diag_start');S.diagStep=0;render();}
  else if(a==='diag-reset'){S.diag={};S.diagStep=0;render();}
  else if(a==='login-google'){cloudCall('loginGoogle');}
  else if(a==='reset-pw'){var em=document.getElementById('em');cloudCall('resetPassword',em?em.value.trim():'');}
  else if(a==='consent'){var ok=document.getElementById('over14'),rg=document.getElementById('region');if(!ok||!ok.checked){S.cloud.msg='만 14세 이상 부모(보호자) 확인에 체크해 주세요.';render();}else cloudCall('consent',rg?rg.value:'');}
  else if(a==='logout'){cloudCall('logout');}
  else if(a==='add-child'){cloudCall('addChild');}
  else if(a==='delete-ask'){S.cloud.confirmDelete=true;render();}
  else if(a==='delete-no'){S.cloud.confirmDelete=false;render();}
  else if(a==='delete-yes'){cloudCall('deleteAccount');}
  else if(a==='close'){S.detailOpen=false;render();}
  else if(a==='stats-on'){try{localStorage.removeItem(STATS_OFF_KEY);}catch(e){}render();}
  else if(a==='stats-off'){try{localStorage.setItem(STATS_OFF_KEY,'1');}catch(e){}render();}
  else if(a==='pass'){S.pass=!S.pass;S.passSource=null;S.couponMsg='';render();}
  else if(a==='subscribe'){S.storeSheet=true;render();}
  else if(a==='cancelSheet'){S.storeSheet=false;render();}
  else if(a==='buy'){S.storeSheet=false;S.pass=true;S.passSource=S.platform==='ios'?'App Store':'Google Play';render();}
  else if(a==='restore'){render();}
  else if(a==='reset'){var keep=S.selftest,cl=S.cloud;S=sampleState();S.selftest=keep||{};S.cloud=cl;render();}
  else if(a==='setup'){S={sample:false,child:{nickname:'우리 아이',grade:S.child.grade},progress:{},diag:{},pass:false,view:'record',sel:null,mapGrade:S.child.grade,diagStep:null,detailOpen:false,selftest:S.selftest||{},size:S.size,cloud:S.cloud};render();var n=document.getElementById('nick');if(n){n.focus();n.select();}}
});
document.addEventListener('change',function(e){
  if(e.target.dataset&&e.target.dataset.region&&cloudOn()){cloudCall('saveRegion',e.target.value);return;}
  var k=e.target.dataset&&e.target.dataset.st; if(!k)return;
  S.selftest=S.selftest||{}; S.selftest[k]=e.target.checked; render();
  var el=document.getElementById('st-'+k); if(el)el.focus();
});
document.addEventListener('submit',function(e){
  if(e.target.id==='coupon'){e.preventDefault();
    var code=document.getElementById('couponCode').value.trim().toUpperCase().replace(/\s/g,'');
    if(code==='DONGARI-2027'||code==='DONGARI2027'){S.pass=true;S.passSource='coupon';S.couponMsg='동아리 쿠폰이 적용됐어요. 1년 동안 모든 역이 열립니다.';}
    else S.couponMsg=code?'이 코드는 쓸 수 없어요. 철자를 확인하거나, 이미 쓴 코드인지 확인해 주세요.':'쿠폰 코드를 넣어 주세요.';
    render();return;}
  if(e.target.id==='fbForm'){e.preventDefault();
    var tx=document.getElementById('fbText').value.trim().slice(0,1000); if(!tx)return;
    cloudCall('sendFeedback',tx,S.sel||'');return;}
  if(e.target.id==='emailForm'){e.preventDefault();
    var mode=(e.submitter&&e.submitter.dataset.mode)||'in';
    cloudCall(mode==='up'?'signUpEmail':'loginEmail',document.getElementById('em').value.trim(),document.getElementById('pw').value);return;}
  if(e.target.id!=='profile')return; e.preventDefault();
  var n=document.getElementById('nick').value.trim().slice(0,12)||'우리 아이';
  var g=+document.getElementById('grade').value;
  if(g!==S.child.grade){S.diag={};S.diagStep=null;}
  S.child={nickname:n,grade:g};S.sample=false;S.mapGrade=g;S.view='today';if(cloudOn())cloudCall('saveChild',n,g);render();
});
window.matchMedia(WIDE).addEventListener('change',render);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);

window.SUHAK={
  get:function(){return S;},
  set:function(fn){fn(S);syncDiag();if(DATA)render();},
  local:function(){var c=S.cloud;S=localState();S.cloud=c;},
  site:function(d){SITE=d||{};try{localStorage.setItem(SITE_KEY,JSON.stringify(SITE));}catch(e){}if(DATA)render();},
  track:track,
  today:today
};
S.cloud={status:'loading'};
setTimeout(function(){if(!window.Cloud&&S.cloud.status==='loading'){S.cloud={status:'unavailable'};if(DATA)render();}},6000);

fetch('stations.json').then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(function(d){
  DATA=d; d.stations.forEach(function(s){byId[s.id]=s;}); if(S.sel&&!byId[S.sel])S.sel=null; render(); trackVisit();
  fetch('worksheets/catalog.json').then(function(r){return r.ok?r.json():null;}).then(function(c){if(!c)return;CAT=c;CAT_BY={};c.items.forEach(function(x){(x.stations||[]).forEach(function(i){(CAT_BY[i]=CAT_BY[i]||[]).push(x);});});render();}).catch(function(){});
}).catch(function(){document.getElementById('main').innerHTML='<div class="col"><div class="card">역 데이터(stations.json)를 불러오지 못했어요. 같은 폴더에 파일이 있는지 확인해 주세요.</div></div>';});
})();
</script>

<script type="module">
// ---------- Firebase: 로그인·기록 저장 ----------
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithRedirect,
  signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut, deleteUser
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, addDoc, deleteDoc, collection, getDocs, serverTimestamp, writeBatch, increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAlm65URPZODqWMsBHPb8S4V0vJABaNOHQ",
  authDomain: "suhak-sireoyeo.firebaseapp.com",
  projectId: "suhak-sireoyeo",
  storageBucket: "suhak-sireoyeo.firebasestorage.app",
  messagingSenderId: "152725828969",
  appId: "1:152725828969:web:4b1a2e4964632307c579f8"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const H = window.SUHAK;

// 이용 통계: stats/{오늘}/c/{항목} 의 n 을 +1 (같은 항목은 한 번에 한 번만)
function kstDay(){ const t = new Date(Date.now() + 9 * 3600 * 1000); return t.getUTCFullYear() + String(t.getUTCMonth() + 1).padStart(2, '0') + String(t.getUTCDate()).padStart(2, '0'); }
window.Track = function(keys){
  const day = kstDay(), uniq = [...new Set(keys)];
  // 항목마다 따로 저장: 하나가 거절돼도 나머지는 기록됨
  uniq.forEach(k => setDoc(doc(db, 'stats', day, 'c', k), { n: increment(1) }, { merge: true }).catch(e => console.warn('stats', k, e.code)));
};
(window.__tq || []).splice(0).forEach(ks => window.Track(ks));

// 시작 화면 글(관리자가 고친 것)
getDoc(doc(db, 'site', 'intro')).then(d => { if (d.exists()) { const v = d.data(); delete v.updatedAt; delete v.updatedBy; H.site(v); } }).catch(e => console.warn('site', e.code));

const MSG = {
  'auth/invalid-credential':'이메일 또는 비밀번호가 맞지 않아요.',
  'auth/wrong-password':'이메일 또는 비밀번호가 맞지 않아요.',
  'auth/user-not-found':'가입된 이메일이 아니에요. ‘새로 가입’을 눌러 주세요.',
  'auth/email-already-in-use':'이미 가입된 이메일이에요. ‘이메일로 로그인’을 눌러 주세요.',
  'auth/weak-password':'비밀번호를 6자 이상으로 정해 주세요.',
  'auth/invalid-email':'이메일 주소 형식을 확인해 주세요.',
  'auth/missing-email':'이메일을 먼저 입력해 주세요.',
  'auth/popup-closed-by-user':'로그인 창이 닫혔어요. 다시 눌러 주세요.',
  'auth/unauthorized-domain':'이 주소는 로그인이 허용되지 않았어요. Firebase 승인된 도메인을 확인해 주세요.',
  'auth/network-request-failed':'인터넷 연결을 확인해 주세요.',
  'auth/too-many-requests':'시도가 너무 많아요. 잠시 뒤 다시 해 주세요.',
  'permission-denied':'저장 권한이 없어요. 보안 규칙이 게시됐는지 확인해 주세요.'
};
function fail(e){ console.error(e); H.set(S => { S.cloud = Object.assign({}, S.cloud, { msgOk: false, msg: MSG[e && e.code] || '문제가 생겼어요. 잠시 뒤 다시 해 주세요. (' + ((e && e.code) || '알 수 없음') + ')' }); }); }
function ymd(ts){ const d = ts && ts.toDate ? ts.toDate() : new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const kidsRef = uid => collection(db, 'users', uid, 'children');
const progRef = (uid, cid) => collection(db, 'users', uid, 'children', cid, 'progress');

let loginCounted = false;
async function loadChild(uid, child, children, email, region){
  const snap = await getDocs(progRef(uid, child.id));
  const progress = {};
  snap.forEach(d => { const v = d.data(); if (v.status === 'passed' || v.status === 'stuck') progress[d.id] = { s: v.status, at: ymd(v.updatedAt) }; });
  try { localStorage.setItem('suhak-child-' + uid, child.id); } catch (e) {}
  H.set(S => {
    S.cloud = { status: 'on', uid, email, children, childId: child.id, region: region !== undefined ? region : ((S.cloud && S.cloud.region) || '') };
    S.sample = false; S.child = { nickname: child.nickname, grade: child.grade };
    S.progress = progress; S.diag = {}; S.diagStep = null; S.mapGrade = child.grade;
    if (S.sel && !S.progress[S.sel]) S.sel = null;
  });
}

async function openAccount(user){
  const uid = user.uid, email = user.email || '';
  const u = await getDoc(doc(db, 'users', uid));
  if (!u.exists()) { H.set(S => { S.cloud = { status: 'consent', uid, email }; S.view = 'record'; }); return; }
  const region = u.data().region || '';
  const ks = await getDocs(kidsRef(uid));
  let children = [];
  ks.forEach(d => { const v = d.data(); children.push({ id: d.id, nickname: v.nickname, grade: v.grade, t: v.createdAt ? v.createdAt.toMillis() : 0 }); });
  children.sort((a, b) => a.t - b.t);
  if (!children.length) {
    // 처음 로그인: 이 기기에서 쓰던 아이와 기록을 계정으로 옮김(예시 데이터는 옮기지 않음)
    const L = H.get();
    const nick = L.sample ? '우리 아이' : L.child.nickname, grade = L.sample ? L.child.grade : L.child.grade;
    const ref = await addDoc(kidsRef(uid), { nickname: nick, grade: grade, createdAt: serverTimestamp() });
    if (!L.sample && L.progress) {
      const b = writeBatch(db); let n = 0;
      Object.keys(L.progress).forEach(id => { const p = L.progress[id]; if (p.s === 'passed' || p.s === 'stuck') { b.set(doc(db, 'users', uid, 'children', ref.id, 'progress', id), { status: p.s, updatedAt: serverTimestamp() }); n++; } });
      if (n) await b.commit();
    }
    children = [{ id: ref.id, nickname: nick, grade }];
  }
  let pick = null; try { pick = localStorage.getItem('suhak-child-' + uid); } catch (e) {}
  const child = children.find(k => k.id === pick) || children[0];
  await loadChild(uid, child, children, email, region);
  if (!loginCounted) { loginCounted = true; H.track('login'); }
}

onAuthStateChanged(auth, user => {
  if (!user) { H.local(); H.set(S => { S.cloud = { status: 'off' }; }); return; }
  openAccount(user).catch(fail);
});

window.Cloud = {
  async loginGoogle(){
    const p = new GoogleAuthProvider();
    try { await signInWithPopup(auth, p); }
    catch (e) { if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') { await signInWithRedirect(auth, p); } else fail(e); }
  },
  async loginEmail(em, pw){ try { await signInWithEmailAndPassword(auth, em, pw); } catch (e) { fail(e); } },
  async signUpEmail(em, pw){ try { await createUserWithEmailAndPassword(auth, em, pw); } catch (e) { fail(e); } },
  async resetPassword(em){
    try { await sendPasswordResetEmail(auth, em); H.set(S => { S.cloud = Object.assign({}, S.cloud, { msg: em + ' 로 비밀번호 재설정 메일을 보냈어요.', msgOk: true }); }); }
    catch (e) { fail(e); }
  },
  async consent(region){
    const user = auth.currentUser; if (!user) return;
    try {
      await setDoc(doc(db, 'users', user.uid), { displayName: user.displayName || '', over14: true, region: region || '', createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
      H.track('signup');
      await openAccount(user);
    } catch (e) { fail(e); }
  },
  async logout(){ try { await signOut(auth); } catch (e) { fail(e); } },
  async saveProgress(id, status){
    const c = H.get().cloud; if (!c || c.status !== 'on') return;
    try { await setDoc(doc(db, 'users', c.uid, 'children', c.childId, 'progress', id), { status, updatedAt: serverTimestamp() }); }
    catch (e) { fail(e); }
  },
  async saveChild(nickname, grade){
    const c = H.get().cloud; if (!c || c.status !== 'on') return;
    try {
      await setDoc(doc(db, 'users', c.uid, 'children', c.childId), { nickname, grade: Number(grade) }, { merge: true });
      H.set(S => { S.cloud.children = S.cloud.children.map(k => k.id === c.childId ? Object.assign({}, k, { nickname, grade: Number(grade) }) : k); });
    } catch (e) { fail(e); }
  },
  async addChild(){
    const c = H.get().cloud; if (!c || c.status !== 'on' || c.children.length >= 4) return;
    try {
      const ref = await addDoc(kidsRef(c.uid), { nickname: '아이 ' + (c.children.length + 1), grade: 1, createdAt: serverTimestamp() });
      H.track('child_add');
      const children = c.children.concat([{ id: ref.id, nickname: '아이 ' + (c.children.length + 1), grade: 1 }]);
      await loadChild(c.uid, children[children.length - 1], children, c.email);
      H.set(S => { S.view = 'record'; });
      setTimeout(() => { const n = document.getElementById('nick'); if (n) { n.focus(); n.select(); } }, 50);
    } catch (e) { fail(e); }
  },
  async selectChild(id){
    const c = H.get().cloud; if (!c || c.status !== 'on') return;
    const child = c.children.find(k => k.id === id); if (!child) return;
    try { await loadChild(c.uid, child, c.children, c.email); } catch (e) { fail(e); }
  },
  async saveRegion(region){
    const c = H.get().cloud; if (!c || c.status !== 'on') return;
    try {
      await setDoc(doc(db, 'users', c.uid), { region: region || '', updatedAt: serverTimestamp() }, { merge: true });
      H.set(S => { S.cloud.region = region || ''; S.cloud.msg = '지역을 저장했어요.'; S.cloud.msgOk = true; });
    } catch (e) { fail(e); }
  },
  async sendFeedback(text, stationId){
    const c = H.get().cloud; if (!c || c.status !== 'on') return;
    try {
      await addDoc(collection(db, 'feedback'), { uid: c.uid, text, stationId: stationId || '', createdAt: serverTimestamp() });
      H.track('fb');
      H.set(S => { S.cloud.fbSent = true; });
    } catch (e) { fail(e); }
  },
  async deleteAccount(){
    const user = auth.currentUser; const c = H.get().cloud; if (!user || !c) return;
    const recent = Date.now() - new Date(user.metadata.lastSignInTime).getTime() < 5 * 60 * 1000;
    if (!recent) { H.set(S => { S.cloud.confirmDelete = false; S.cloud.msg = '보안을 위해 로그아웃 후 다시 로그인하고 5분 안에 삭제해 주세요.'; }); return; }
    try {
      for (const k of c.children) {
        const ps = await getDocs(progRef(c.uid, k.id));
        for (const d of ps.docs) await deleteDoc(d.ref);
        await deleteDoc(doc(db, 'users', c.uid, 'children', k.id));
      }
      await deleteDoc(doc(db, 'users', c.uid));
      await deleteUser(user);
      try { localStorage.removeItem('suhak-child-' + c.uid); } catch (e) {}
    } catch (e) { fail(e); }
  }
};
</script>
